<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volante de inercia</title>
<style>
  :root{
    color-scheme: light;
    --navy:#3b3a7a; --navy-2:#2a295a; --blue:#2f6fb0; --teal:#0f8a8f;
    --orange:#e67e22; --red:#b23b3b; --ink:#24313a; --muted:#5d6b74;
    --line:#d6dbe5; --paper:#fff; --wash:#f4f4fa; --focus:#ffd166;
    font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;color:var(--ink)}
  body{padding:8px}
  .lab{max-width:1120px;margin:0 auto;overflow:hidden;border:1px solid #cfd3e3;
       border-radius:16px;background:var(--paper);box-shadow:0 8px 24px rgb(35 40 93 / 10%)}
  .lab-header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;
       padding:18px 22px;color:#fff;background:linear-gradient(125deg,var(--navy-2),var(--navy))}
  .lab-header h1{margin:0 0 4px;font-size:clamp(1.16rem,2.2vw,1.5rem);line-height:1.2}
  .lab-header p{max-width:740px;margin:0;color:#e6e6f3;font-size:.92rem;line-height:1.45}
  .badge{flex:0 0 auto;padding:6px 10px;border:1px solid rgb(255 255 255/32%);
       border-radius:999px;background:rgb(255 255 255/10%);font-size:.78rem;white-space:nowrap}
  .readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;
       padding:14px 18px;border-bottom:1px solid var(--line);background:var(--wash)}
  .metric{padding:10px 12px;border:1px solid #dcdfec;border-radius:10px;background:#fff}
  .metric .label{display:block;margin-bottom:2px;color:var(--muted);font-size:.7rem;
       font-weight:700;letter-spacing:.055em;text-transform:uppercase}
  .metric .label .sim{text-transform:none}   /* ω en minúscula: es el símbolo, no una palabra */
  .metric output{display:block;color:var(--navy-2);font-size:1.02rem;font-weight:750}
  .metric.destacada{border-left:5px solid var(--orange)}
  .cuerpo{display:grid;grid-template-columns:minmax(280px,1fr) minmax(260px,320px);gap:0}
  @media (max-width:820px){.cuerpo{grid-template-columns:1fr}}
  .escena{padding:12px 18px 18px}
  .panel{padding:16px 18px;border-left:1px solid var(--line);background:#fbfbfe}
  @media (max-width:820px){.panel{border-left:0;border-top:1px solid var(--line)}}
  .campo{margin-bottom:14px}
  .campo label{display:block;margin-bottom:4px;font-size:.82rem;font-weight:600;color:var(--navy-2)}
  .campo .valor{float:right;font-weight:700;color:var(--blue)}
  input[type=range]{width:100%;accent-color:var(--blue)}
  select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;
       background:#fff;font:inherit;color:inherit}
  input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .formula{margin:2px 0 14px;padding:10px 12px;border:1.5px solid var(--orange);
       border-radius:10px;background:#fef6ec;color:#8a4f12;font-size:1rem;text-align:center}
  .botones{display:flex;gap:8px;flex-wrap:wrap}
  button{padding:8px 14px;border:1px solid var(--navy);border-radius:8px;background:var(--navy);
       color:#fff;font:inherit;font-weight:600;cursor:pointer}
  button.sec{background:#fff;color:var(--navy)}
  .aviso{margin-top:10px;padding:8px 10px;border-left:4px solid var(--red);background:#f9efee;
       color:#8a2b2b;font-size:.85rem;border-radius:6px}
  .aviso[hidden]{display:none}
  .nota{margin:10px 18px 16px;color:var(--muted);font-size:.8rem;line-height:1.5}
  svg{display:block;width:100%;height:auto}
</style>
</head>
<body>
<div class="lab">
  <div class="lab-header">
    <div>
      <h1>Volante de inercia</h1>
      <p>Elige el sólido, dale masa y tamaño, ponlo a girar y hazle ceder energía.
         La cadena es siempre la misma: forma del sólido → <em>I</em> → <em>ω</em> → E<sub>c</sub>.</p>
    </div>
    <span class="badge">Energía cinética de rotación</span>
  </div>

  <div class="readout">
    <div class="metric"><span class="label">Momento de inercia <span class="sim">I</span></span><output id="oI">—</output></div>
    <div class="metric"><span class="label">Velocidad angular <span class="sim">ω</span></span><output id="oW">—</output></div>
    <div class="metric destacada"><span class="label">Energía cinética</span><output id="oE">—</output></div>
    <div class="metric"><span class="label">Giro final</span><output id="oNf">—</output></div>
    <div class="metric"><span class="label">Potencia de recuperación</span><output id="oP">—</output></div>
  </div>

  <div class="cuerpo">
    <div class="escena">
      <svg id="dib" viewBox="0 0 460 300" role="img" aria-labelledby="ttl desc">
        <title id="ttl">Sólido girando alrededor de su eje</title>
        <desc id="desc">Representación del sólido seleccionado girando; la velocidad del giro
          es proporcional a la velocidad angular calculada.</desc>
        <g id="pieza" transform="translate(230,150)"></g>
        <line x1="230" y1="30" x2="230" y2="270" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/>
        <g id="marca" transform="translate(230,150)">
          <circle r="5" cx="0" cy="0" fill="#2a295a"/>
        </g>
        <text x="230" y="20" text-anchor="middle" font-size="12" fill="#5d6b74">eje de giro</text>
      </svg>
      <p class="nota" id="pie"></p>
    </div>

    <div class="panel">
      <div class="campo">
        <label for="solido">Sólido y eje de giro</label>
        <select id="solido">
          <option value="disco">Disco o cilindro macizo</option>
          <option value="hueco">Cilindro hueco (pared delgada)</option>
          <option value="varilla_c">Varilla, eje por el centro</option>
          <option value="varilla_e">Varilla, eje por un extremo</option>
        </select>
      </div>
      <p class="formula" id="formula"></p>

      <div class="campo">
        <label for="masa">Masa <span class="valor" id="vMasa"></span></label>
        <input type="range" id="masa" min="1" max="200" step="0.5" value="60">
      </div>
      <div class="campo" id="cR">
        <label for="radio">Radio R <span class="valor" id="vRadio"></span></label>
        <input type="range" id="radio" min="0.05" max="0.60" step="0.01" value="0.40">
      </div>
      <div class="campo" id="cL" hidden>
        <label for="largo">Longitud L <span class="valor" id="vLargo"></span></label>
        <input type="range" id="largo" min="0.20" max="2.00" step="0.05" value="1.00">
      </div>
      <div class="campo">
        <label for="rpm">Régimen de giro <span class="valor" id="vRpm"></span></label>
        <input type="range" id="rpm" min="0" max="4000" step="50" value="3000">
      </div>
      <div class="campo">
        <label for="cede">Energía que cede <span class="valor" id="vCede"></span></label>
        <input type="range" id="cede" min="0" max="20" step="0.5" value="4.5">
      </div>
      <div class="campo">
        <label for="tiempo">Tiempo para recuperar el giro <span class="valor" id="vTiempo"></span></label>
        <input type="range" id="tiempo" min="1" max="20" step="1" value="5">
      </div>
      <div class="botones">
        <button id="btnFrenar">Ceder la energía</button>
        <button id="btnReset" class="sec">Reiniciar</button>
      </div>
      <p class="aviso" id="aviso" hidden></p>
    </div>
  </div>
</div>

<script>
"use strict";

/* ---------- física (función pura: se puede probar fuera del navegador) ---------- */
var SOLIDOS = {
  disco:    {etq:"Disco o cilindro macizo", formula:"I = ½ · m · R²",   usa:"R", I:function(m,R,L){return 0.5*m*R*R;}},
  hueco:    {etq:"Cilindro hueco",          formula:"I = m · R²",       usa:"R", I:function(m,R,L){return m*R*R;}},
  varilla_c:{etq:"Varilla, eje central",    formula:"I = m · L² / 12",  usa:"L", I:function(m,R,L){return m*L*L/12;}},
  varilla_e:{etq:"Varilla, eje extremo",    formula:"I = m · L² / 3",   usa:"L", I:function(m,R,L){return m*L*L/3;}}
};

function calcular(p){
  var s = SOLIDOS[p.solido];
  var I = s.I(p.masa, p.radio, p.largo);          // kg·m²
  var w = 2*Math.PI*p.rpm/60;                      // rad/s
  var Ec = 0.5*I*w*w;                              // J
  var dE = p.cede*1000;                            // J
  var frena = dE >= Ec;
  var w2 = frena ? 0 : Math.sqrt(w*w - 2*dE/I);
  var rpm2 = 60*w2/(2*Math.PI);
  var P = p.tiempo > 0 ? dE/p.tiempo : 0;          // W para devolverle lo cedido
  return {I:I, w:w, Ec:Ec, dE:dE, wf:w2, rpmf:rpm2, P:P, frena:frena, usa:s.usa,
          formula:s.formula, etq:s.etq};
}

if (typeof module !== "undefined" && module.exports) { module.exports = {calcular:calcular, SOLIDOS:SOLIDOS}; }

/* ---------- interfaz ---------- */
if (typeof document !== "undefined") (function(){
  var $ = function(id){ return document.getElementById(id); };
  var num = function(x, d){ return x.toLocaleString("es-ES", {minimumFractionDigits:d, maximumFractionDigits:d}); };

  var estado = {frenado:false};

  function leer(){
    return {solido:$("solido").value, masa:+$("masa").value, radio:+$("radio").value,
            largo:+$("largo").value, rpm:+$("rpm").value, cede:+$("cede").value,
            tiempo:+$("tiempo").value};
  }

  function dibujar(usa, R, L){
    var g = $("pieza"), esc;
    if (usa === "R"){
      esc = 26 + 92*(R-0.05)/0.55;                  // radio en px (cabe en el lienzo)
      var hueco = $("solido").value === "hueco";
      g.innerHTML = '<circle r="'+esc.toFixed(1)+'" fill="'+(hueco?"none":"#eaf1fa")+'" stroke="#2f6fb0" stroke-width="'+(hueco?10:3)+'"/>'
                  + '<line x1="0" y1="0" x2="'+esc.toFixed(1)+'" y2="0" stroke="#e67e22" stroke-width="4"/>';
    } else {
      esc = 35 + 105*(L-0.2)/1.8;                   // semilongitud en px
      var extremo = $("solido").value === "varilla_e";
      var x0 = extremo ? 0 : -esc, x1 = extremo ? 2*esc : esc;
      g.innerHTML = '<rect x="'+x0.toFixed(1)+'" y="-7" width="'+(x1-x0).toFixed(1)+'" height="14" rx="6" fill="#eaf1fa" stroke="#2f6fb0" stroke-width="3"/>'
                  + '<line x1="0" y1="0" x2="'+(x1*0.92).toFixed(1)+'" y2="0" stroke="#e67e22" stroke-width="3"/>';
    }
  }

  var angulo = 0, ultimo = 0, wActual = 0;
  function animar(t){
    var dt = ultimo ? (t-ultimo)/1000 : 0; ultimo = t;
    angulo += (wActual*180/Math.PI)*dt/12;          // ralentizado 12x para que se vea
    angulo %= 360;
    $("pieza").setAttribute("transform","translate(230,150) rotate("+angulo.toFixed(2)+")");
    $("marca").setAttribute("transform","translate(230,150) rotate("+angulo.toFixed(2)+")");
    requestAnimationFrame(animar);
  }

  function pintar(){
    var p = leer(), r = calcular(p);
    $("vMasa").textContent  = num(p.masa,1)+" kg";
    $("vRadio").textContent = num(p.radio,2)+" m";
    $("vLargo").textContent = num(p.largo,2)+" m";
    $("vRpm").textContent   = num(p.rpm,0)+" rpm";
    $("vCede").textContent  = num(p.cede,1)+" kJ";
    $("vTiempo").textContent= num(p.tiempo,0)+" s";
    $("cR").hidden = r.usa !== "R";
    $("cL").hidden = r.usa !== "L";
    $("formula").textContent = r.formula;

    $("oI").textContent  = num(r.I,2)+" kg·m²";
    $("oW").textContent  = num(r.w,1)+" rad/s";
    $("oE").textContent  = num(r.Ec/1000,1)+" kJ";
    $("oNf").textContent = num(r.rpmf,2)+" rpm";
    $("oP").textContent  = num(r.P,0)+" W  ("+num(r.P/735.5,2)+" CV)";

    $("aviso").hidden = !r.frena;
    if (r.frena) $("aviso").textContent =
      "Le pides más energía de la que tiene almacenada ("+num(r.Ec/1000,1)+" kJ): el volante se para.";

    $("pie").textContent = r.etq + " · " + r.formula.replace("I =","I =") +
      " · pierde " + num(p.cede,1) + " kJ y baja de " + num(p.rpm,0) + " a " + num(r.rpmf,2) + " rpm.";

    dibujar(r.usa, p.radio, p.largo);
    wActual = estado.frenado ? r.wf : r.w;
  }

  ["solido","masa","radio","largo","rpm","cede","tiempo"].forEach(function(id){
    $(id).addEventListener("input", function(){ estado.frenado = false; pintar(); });
  });
  $("btnFrenar").addEventListener("click", function(){ estado.frenado = true; pintar(); });
  $("btnReset").addEventListener("click", function(){ estado.frenado = false; pintar(); });

  pintar();
  requestAnimationFrame(animar);
})();
</script>
</body>
</html>
